[pytest]
# Pytest configuration for RAG system

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options
# -v: verbose output
# -m "not integration": skip integration tests by default
addopts = -v -m "not integration"

# Asyncio mode
asyncio_mode = auto

# Test markers
markers =
    unit: Unit tests (no external dependencies, runs by default)
    integration: Integration tests (requires Docker services, skipped by default)

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test paths
testpaths = backend/tests

# Python path
pythonpath = backend
